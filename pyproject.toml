[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-value"
version = "0.1.0"
description = "Scan a battery passport and find out what the pack is worth."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.24",
]

[project.optional-dependencies]
# The API exists to serve the phone UI, where the main path is photographing
# the QR code, so server-side image decoding ships with it rather than as an
# afterthought.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.8",
]
scan = ["opencv-python-headless>=4.8", "pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pytest>=7.4",
]

[project.scripts]
battery-value = "battery_value.cli:main"
bv = "battery_value.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battery_value = ["**/data/*.json", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:battery_value.*"]
