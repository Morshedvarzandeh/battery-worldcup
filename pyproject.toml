[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-worldcup"
version = "0.0.1"
description = "A reference and open benchmark for lithium-ion battery State of Health (SOH) estimation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Morshed Varzandeh" }]
keywords = ["battery", "state of health", "SOH", "degradation", "benchmark"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scipy>=1.11",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
deep = ["torch>=2.1"]
physics = ["pybamm>=24.1"]
dev = ["pytest>=7.4", "ruff>=0.4", "pre-commit>=3.5"]

[project.scripts]
bwc = "battery_worldcup.cli:main"

[project.urls]
Homepage = "https://github.com/Morshedvarzandeh/battery-worldcup"
Roadmap = "https://github.com/Morshedvarzandeh/battery-worldcup/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"src/battery_worldcup/data/registry.py" = ["E501"]  # citations and URLs are not wrapped

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
