[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-worldcup"
version = "0.1.0"
description = "Scan a battery passport, get the residual value of the pack from live material and system market prices."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.24",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
scan = ["opencv-python-headless>=4.8", "pillow>=10.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "pytest>=7.4",
]

[project.scripts]
bwc = "battery_worldcup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battery_worldcup = ["**/data/*.json", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:battery_worldcup.*"]
